name: ZeroStep / Playwright Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'proxy.ts'
      - 'next.config.ts'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'proxy.ts'
      - 'next.config.ts'
      - 'package.json'
      - 'package-lock.json'

# Least privilege: the job checks out code and uploads an artifact. It needs
# neither write access to the repo nor any of the default write scopes.
permissions:
  contents: read

jobs:
  e2e-tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    # .env.local is gitignored, so `next dev` starts in CI with no Supabase
    # config and every request dies in lib/supabase/proxy.ts. These are the
    # well-known local-dev demo keys -- never valid against a hosted project --
    # already committed in tests/isolation/helpers.ts for the same reason.
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The specs sign in as seeded users and post real rows, so they need the
      # local stack with migrations and seed.sql applied. Resolved via npx so
      # it uses the pinned devDependency rather than "latest" -- same reasoning
      # as ci.yml's isolation job.
      - run: npx supabase start
      - run: npx supabase db reset

      - run: npx playwright install --with-deps chromium

      # playwright.config.ts starts `next dev` itself via webServer.
      - run: npx playwright test
        env:
          E2E_STAMP: ${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
