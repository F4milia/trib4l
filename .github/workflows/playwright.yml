name: ZeroStep / Playwright Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'proxy.ts'
      - 'next.config.ts'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'proxy.ts'
      - 'next.config.ts'
      - 'package.json'
      - 'package-lock.json'

# Least privilege: the job checks out code and uploads an artifact. It needs
# neither write access to the repo nor any of the default write scopes.
permissions:
  contents: read

jobs:
  e2e-tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    # .env.local is gitignored, so `next dev` starts in CI with no Supabase
    # config and every request dies in lib/supabase/proxy.ts. These are the
    # well-known local-dev demo keys -- never valid against a hosted project --
    # already committed in tests/isolation/helpers.ts for the same reason.
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      # Cloudflare's PUBLISHED Turnstile test keys, not credentials. Needed on
      # BOTH sides here: the secret so GoTrue can verify (config.toml has
      # [auth.captcha] enabled), and the site key so `next dev` renders a widget
      # for the browser specs to get a token from. Without the site key the
      # forms carry no token and every browser sign-in gets 400 captcha_failed.
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000BB

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The specs sign in as seeded users and post real rows, so they need the
      # local stack with migrations and seed.sql applied. Resolved via npx so
      # it uses the pinned devDependency rather than "latest" -- same reasoning
      # as ci.yml's isolation job.
      - run: npx supabase start
      - run: npx supabase db reset

      - run: npx playwright install --with-deps chromium

      # playwright.config.ts starts `next dev` itself via webServer.
      - run: npx playwright test
        env:
          E2E_STAMP: ${{ github.run_id }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
