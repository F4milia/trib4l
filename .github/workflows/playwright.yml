name: ZeroStep / Playwright Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'components/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'components/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'

jobs:
  e2e-tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The specs sign in as seeded users and post real rows, so they need the
      # local stack with migrations and seed.sql applied. Resolved via npx so
      # it uses the pinned devDependency rather than "latest" -- same reasoning
      # as ci.yml's isolation job.
      - run: npx supabase start
      - run: npx supabase db reset

      - run: npx playwright install --with-deps chromium

      # playwright.config.ts starts `next dev` itself via webServer.
      - run: npx playwright test
        env:
          E2E_STAMP: ${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
